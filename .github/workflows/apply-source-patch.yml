name: Apply Novera source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/apply.py'
      - '.github/workflows/apply-source-patch.yml'

permissions:
  contents: write

jobs:
  apply-source-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: python patches/apply.py

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('No inline script found')
          js = html[start + len('<script>'):end]
          Path('/tmp/novera-inline.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/novera-inline.js

      - name: Commit complete source
        shell: bash
        run: |
          git config user.name "Novera Source Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js styles.css README.md
          if git diff --cached --quiet; then
            echo "Source is already synchronized."
            exit 0
          fi
          message="$(git log -1 --pretty=%s)"
          git commit -m "$message"
          git push
