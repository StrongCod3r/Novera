name: Apply Novera source patch

on:
  push:
    branches: [main]
    paths:
      - 'patches/current.patch'
      - '.github/workflows/apply-source-patch.yml'

permissions:
  contents: write

jobs:
  apply-source-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patch
        shell: bash
        run: |
          git apply --check patches/current.patch
          git apply patches/current.patch

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check app.js
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', html, re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/novera-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/novera-inline.js

      - name: Commit complete source
        shell: bash
        run: |
          git config user.name "Novera Source Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js styles.css README.md
          if git diff --cached --quiet; then
            echo "Source is already synchronized."
            exit 0
          fi
          message="$(git log -1 --pretty=%s)"
          git commit -m "$message"
          git push
