name: Sync complete Novera source

on:
  push:
    branches: [main]
    paths:
      - 'source/novera-source.part-*'
      - '.github/workflows/sync-source.yml'

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          cat source/novera-source.part-* > /tmp/novera-source.tar.xz
          tar -xJf /tmp/novera-source.tar.xz

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "Novera Source Sync"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js styles.css README.md
          if git diff --cached --quiet; then
            echo "Source is already synchronized."
            exit 0
          fi
          git commit -m "feat: sync complete Novera source"
          git push
